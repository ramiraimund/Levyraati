<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Levyraati</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0 0 84px 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 12px 16px;
    }
    .wrap { max-width: 540px; margin: 0 auto; }
    .header-row { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; display: inline-block; }
    .dot.ok { background: #10b981; }
    main { max-width: 540px; margin: 0 auto; padding: 16px; }
    .hidden { display: none !important; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    input, select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #10b981; }
    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: #10b981; color: #052e16; }
    .btn-primary:active { opacity: 0.85; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-danger { background: #4c0519; color: #fda4af; }
    .btn-sm { padding: 7px 11px; font-size: 12px; }
    .album-item { display: flex; gap: 12px; align-items: center; }
    .cover {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      background: #0f172a;
      flex-shrink: 0;
    }
    .info { flex: 1; min-width: 0; }
    .title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { color: #34d399; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { color: #94a3b8; font-size: 11px; margin-top: 2px; }
    .score-pill {
      background: #0f172a;
      border: 1px solid #10b981;
      color: #34d399;
      font-weight: 800;
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 10px;
    }
    .alert {
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      margin-top: 10px;
      word-break: break-word;
    }
    .alert-err { background: #450a0a; border: 1px solid #991b1b; color: #fecaca; }
    .alert-ok { background: #022c22; border: 1px solid #065f46; color: #a7f3d0; }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 64px;
    }
    .nav-btn {
      background: transparent;
      color: #94a3b8;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      padding: 4px;
    }
    .nav-btn.active { color: #10b981; }
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(2, 6, 23, 0.9);
      overflow-y: auto;
      padding: 16px;
    }
    .modal-box {
      max-width: 500px;
      margin: 20px auto;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 16px;
    }
    .track-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      color: #cbd5e1;
      padding: 8px 10px;
      margin-bottom: 4px;
      font-size: 12px;
      text-align: left;
    }
    .track-row.fav { background: #064e3b; color: #6ee7b7; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin: 10px 0 4px; }
  </style>
</head>
<body>

  <header>
    <div class="wrap header-row">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#1e293b"/>
          <circle cx="32" cy="32" r="22" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
          <circle cx="32" cy="32" r="7" fill="#10b981"/>
        </svg>
        <div>
          <h1>Levyraati</h1>
          <div class="badge">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Ei yhdistetty</span>
          </div>
        </div>
      </div>
      <div id="statsText" style="font-size:12px;color:#94a3b8;">0 arviota</div>
    </div>
  </header>

  <main>
    <!-- 1. ARVIOT -->
    <section id="tab-reviews">
      <div class="row" style="margin-bottom:12px;">
        <input id="filterInput" type="text" placeholder="Suodata arvioita..." oninput="renderReviews()" />
        <select id="sortSelect" style="width:120px;" onchange="renderReviews()">
          <option value="newest">Uusin</option>
          <option value="highest">Paras</option>
          <option value="lowest">Heikoin</option>
        </select>
      </div>
      <div id="reviewsList"></div>
    </section>

    <!-- 2. HAE -->
    <section id="tab-search" class="hidden">
      <form onsubmit="runSearch(event)" class="row">
        <input id="searchInput" type="text" placeholder="Hae artistia tai albumia..." />
        <button type="submit" id="searchBtn" class="btn-primary">Hae</button>
      </form>
      <div id="searchMsg" class="hidden"></div>
      <div id="searchResults" style="margin-top:12px;"></div>
    </section>

    <!-- 3. JONO -->
    <section id="tab-queue" class="hidden">
      <div class="row" style="justify-content:space-between;margin-bottom:12px;">
        <strong>Kuuntelujono</strong>
        <span id="queueCount" style="font-size:12px;color:#94a3b8;">0 levyä</span>
      </div>
      <div id="queueList"></div>
    </section>

    <!-- 4. ASETUKSET -->
    <section id="tab-settings" class="hidden">
      <div class="card">
        <strong style="font-size:16px;">Spotify API -asetukset</strong>
        <label>Client ID</label>
        <input id="clientIdInput" type="text" placeholder="Liitä Client ID" />
        <label>Client Secret</label>
        <input id="clientSecretInput" type="password" placeholder="Liitä Client Secret" />
        <div class="row" style="margin-top:12px;">
          <button type="button" class="btn-primary" style="flex:1;" onclick="saveAndTest()">Tallenna ja testaa</button>
          <button type="button" class="btn-secondary" onclick="clearKeys()">Tyhjennä</button>
        </div>
        <div id="testResult" class="hidden"></div>
      </div>

      <div class="card">
        <strong style="font-size:15px;">Varmuuskopiointi</strong>
        <div class="row" style="margin-top:10px;">
          <button type="button" class="btn-secondary" style="flex:1;" onclick="exportData()">Vie tiedosto</button>
          <button type="button" class="btn-secondary" style="flex:1;" onclick="document.getElementById('importFile').click()">Tuo tiedosto</button>
          <input id="importFile" type="file" accept=".json" class="hidden" onchange="importData(event)" />
        </div>
      </div>
    </section>
  </main>

  <!-- ARVIOINTIMODAALI -->
  <div id="modal" class="modal-bg hidden">
    <div class="modal-box">
      <div class="row" style="align-items:flex-start;">
        <img id="mCover" class="cover" style="width:72px;height:72px;" src="" alt="" />
        <div class="info">
          <div id="mTitle" class="title" style="font-size:16px;"></div>
          <div id="mArtist" class="artist" style="font-size:13px;"></div>
          <div id="mYear" class="meta"></div>
        </div>
        <button type="button" class="btn-secondary btn-sm" onclick="closeModal()">Sulje</button>
      </div>

      <div class="card" style="margin-top:12px;background:#0f172a;">
        <div class="row" style="justify-content:space-between;">
          <span style="font-size:12px;">Arvosana</span>
          <strong id="mScoreVal" style="color:#10b981;font-size:18px;">8.0 / 10</strong>
        </div>
        <input id="mSlider" type="range" min="1" max="10" step="0.5" value="8" style="padding:0;margin-top:8px;"
          oninput="document.getElementById('mScoreVal').textContent = Number(this.value).toFixed(1) + ' / 10'" />
      </div>

      <label>Kommentti</label>
      <textarea id="mComment" rows="3" placeholder="Kirjoita mietteet levystä..."></textarea>

      <label>Kappaleet (napauta suosikit)</label>
      <div id="mTracks" style="max-height:180px;overflow-y:auto;"></div>

      <div class="row" style="margin-top:14px;">
        <button type="button" class="btn-primary" style="flex:1;" onclick="saveReview()">Tallenna arvio</button>
        <button type="button" id="mDelBtn" class="btn-danger hidden" onclick="deleteReview()">Poista</button>
      </div>
    </div>
  </div>

  <!-- ALAVALIKKO -->
  <nav>
    <button type="button" id="nav-reviews" class="nav-btn active" onclick="goTab('reviews')">
      <span style="font-size:18px;">&#9733;</span>
      <span>Arviot</span>
    </button>
    <button type="button" id="nav-search" class="nav-btn" onclick="goTab('search')">
      <span style="font-size:18px;">&#128269;</span>
      <span>Hae</span>
    </button>
    <button type="button" id="nav-queue" class="nav-btn" onclick="goTab('queue')">
      <span style="font-size:18px;">&#9776;</span>
      <span>Jono</span>
    </button>
    <button type="button" id="nav-settings" class="nav-btn" onclick="goTab('settings')">
      <span style="font-size:18px;">&#9881;</span>
      <span>Asetukset</span>
    </button>
  </nav>

  <script>
    // Purkaa mahdollisen vanhan jumittuneen Service Workerin
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }

    function loadArr(key) {
      try {
        var d = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(d) ? d : [];
      } catch (e) { return []; }
    }

    var reviews = loadArr('levyraati_reviews');
    var queue = loadArr('levyraati_queue');
    var currentAlbum = null;
    var favSet = new Set();

    function getKeys() {
      var id = (localStorage.getItem('spotify_client_id') || localStorage.getItem('spotifyClientId') || '').trim();
      var sec = (localStorage.getItem('spotify_client_secret') || localStorage.getItem('spotifyClientSecret') || '').trim();
      return { id: id, sec: sec };
    }

    function refreshBadge() {
      var k = getKeys();
      var dot = document.getElementById('statusDot');
      var txt = document.getElementById('statusText');
      if (k.id && k.sec) {
        dot.className = 'dot ok';
        txt.textContent = 'Spotify API valmiina';
      } else {
        dot.className = 'dot';
        txt.textContent = 'Spotify ei yhdistetty';
      }
    }

    function goTab(name) {
      var tabs = ['reviews', 'search', 'queue', 'settings'];
      for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
        document.getElementById('nav-' + t).classList.toggle('active', t === name);
      }
      if (name === 'reviews') renderReviews();
      if (name === 'queue') renderQueue();
    }

    async function fetchToken() {
      var k = getKeys();
      if (!k.id || !k.sec) throw new Error('Täytä Client ID ja Client Secret Asetukset-välilehdellä.');
      var res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: {
          'Authorization': 'Basic ' + btoa(k.id + ':' + k.sec),
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: 'grant_type=client_credentials'
      });
      var data = await res.json().catch(function() { return {}; });
      if (!res.ok) {
        throw new Error('Avainvirhe (' + res.status + '): ' + (data.error_description || data.error || 'Tuntematon'));
      }
      return data.access_token;
    }

    async function spotifySearch(q) {
      var token = await fetchToken();
      var res = await fetch('https://api.spotify.com/v1/search?q=' + encodeURIComponent(q) + '&type=album&limit=15', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      var data = await res.json().catch(function() { return {}; });
      if (!res.ok) {
        var msg = (data && data.error && data.error.message) ? data.error.message : ('HTTP ' + res.status);
        throw new Error('Spotify esti haun (' + res.status + '): ' + msg);
      }
      return (data.albums && data.albums.items) ? data.albums.items : [];
    }

    async function runSearch(e) {
      e.preventDefault();
      var q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      var btn = document.getElementById('searchBtn');
      var msg = document.getElementById('searchMsg');
      var box = document.getElementById('searchResults');

      btn.disabled = true;
      btn.textContent = '...';
      msg.className = 'hidden';
      box.innerHTML = '';

      try {
        var items = await spotifySearch(q);
        if (!items.length) {
          msg.className = 'alert alert-ok';
          msg.textContent = 'Ei tuloksia.';
          return;
        }
        items.forEach(function(a) {
          var cover = (a.images && a.images[1]) ? a.images[1].url : ((a.images && a.images[0]) ? a.images[0].url : '');
          var artist = a.artists ? a.artists.map(function(x) { return x.name; }).join(', ') : '';
          var year = (a.release_date || '').slice(0, 4);
          var div = document.createElement('div');
          div.className = 'card album-item';
          div.innerHTML =
            '<img class="cover" src="' + cover + '" alt="" />' +
            '<div class="info">' +
              '<div class="title">' + esc(a.name) + '</div>' +
              '<div class="artist">' + esc(artist) + '</div>' +
              '<div class="meta">' + year + ' &bull; ' + (a.total_tracks || '?') + ' kpl</div>' +
            '</div>' +
            '<div style="display:flex;flex-direction:column;gap:6px;">' +
              '<button type="button" class="btn-primary btn-sm r-btn">Arvioi</button>' +
              '<button type="button" class="btn-secondary btn-sm q-btn">+ Jono</button>' +
            '</div>';
          div.querySelector('.r-btn').onclick = function() {
            openModal({ id: a.id, title: a.name, artist: artist, year: year, cover: cover });
          };
          div.querySelector('.q-btn').onclick = function(ev) {
            if (!queue.some(function(x) { return x.id === a.id; })) {
              queue.unshift({ id: a.id, title: a.name, artist: artist, year: year, cover: cover });
              localStorage.setItem('levyraati_queue', JSON.stringify(queue));
              ev.target.textContent = 'Jonossa';
            }
          };
          box.appendChild(div);
        });
      } catch (err) {
        msg.className = 'alert alert-err';
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Hae';
      }
    }

    async function openModal(album) {
      currentAlbum = album;
      var ex = reviews.find(function(r) { return r.id === album.id; });
      favSet = new Set((ex && ex.favoriteTracks) ? ex.favoriteTracks : []);

      document.getElementById('mCover').src = album.cover || '';
      document.getElementById('mTitle').textContent = album.title || '';
      document.getElementById('mArtist').textContent = album.artist || '';
      document.getElementById('mYear').textContent = album.year || '';
      var sc = ex ? ex.score : 8.0;
      document.getElementById('mSlider').value = sc;
      document.getElementById('mScoreVal').textContent = Number(sc).toFixed(1) + ' / 10';
      document.getElementById('mComment').value = (ex && ex.comment) ? ex.comment : '';
      document.getElementById('mDelBtn').classList.toggle('hidden', !ex);
      document.getElementById('modal').classList.remove('hidden');

      var tBox = document.getElementById('mTracks');
      tBox.innerHTML = '<div class="meta">Ladataan kappaleita...</div>';

      var tracks = (ex && ex.tracks && ex.tracks.length) ? ex.tracks : [];
      if (!tracks.length) {
        try {
          var token = await fetchToken();
          var res = await fetch('https://api.spotify.com/v1/albums/' + album.id + '/tracks?limit=50', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (res.ok) {
            var d = await res.json();
            tracks = (d.items || []).map(function(t) { return t.name; });
          }
        } catch (e) {}
      }
      currentAlbum.tracks = tracks;
      tBox.innerHTML = '';
      if (!tracks.length) {
        tBox.innerHTML = '<div class="meta">Ei kappalelistaa.</div>';
        return;
      }
      tracks.forEach(function(tName, idx) {
        var name = typeof tName === 'string' ? tName : (tName.name || '');
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'track-row' + (favSet.has(name) ? ' fav' : '');
        row.innerHTML = '<span>' + (idx + 1) + '. ' + esc(name) + '</span><span>' + (favSet.has(name) ? '★' : '☆') + '</span>';
        row.onclick = function() {
          if (favSet.has(name)) {
            favSet.delete(name);
            row.className = 'track-row';
            row.lastChild.textContent = '☆';
          } else {
            favSet.add(name);
            row.className = 'track-row fav';
            row.lastChild.textContent = '★';
          }
        };
        tBox.appendChild(row);
      });
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function saveReview() {
      if (!currentAlbum) return;
      var obj = Object.assign({}, currentAlbum, {
        score: parseFloat(document.getElementById('mSlider').value),
        comment: document.getElementById('mComment').value.trim(),
        favoriteTracks: Array.from(favSet),
        updatedAt: Date.now()
      });
      var i = reviews.findIndex(function(r) { return r.id === currentAlbum.id; });
      if (i >= 0) reviews[i] = obj; else reviews.unshift(obj);
      queue = queue.filter(function(q) { return q.id !== currentAlbum.id; });
      localStorage.setItem('levyraati_reviews', JSON.stringify(reviews));
      localStorage.setItem('levyraati_queue', JSON.stringify(queue));
      closeModal();
      renderReviews();
    }

    function deleteReview() {
      if (!currentAlbum) return;
      reviews = reviews.filter(function(r) { return r.id !== currentAlbum.id; });
      localStorage.setItem('levyraati_reviews', JSON.stringify(reviews));
      closeModal();
      renderReviews();
    }

    function renderReviews() {
      var list = document.getElementById('reviewsList');
      var f = (document.getElementById('filterInput').value || '').toLowerCase();
      var s = document.getElementById('sortSelect').value;
      document.getElementById('statsText').textContent = reviews.length + ' arviota';

      var arr = reviews.filter(function(r) {
        return (r.title || '').toLowerCase().includes(f) || (r.artist || '').toLowerCase().includes(f);
      });
      if (s === 'highest') arr.sort(function(a, b) { return b.score - a.score; });
      else if (s === 'lowest') arr.sort(function(a, b) { return a.score - b.score; });
      else arr.sort(function(a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });

      if (!arr.length) {
        list.innerHTML = '<div class="card" style="text-align:center;color:#94a3b8;">Ei vielä arvioita.</div>';
        return;
      }
      list.innerHTML = '';
      arr.forEach(function(r) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div class="album-item">' +
            '<img class="cover" src="' + (r.cover || '') + '" alt="" />' +
            '<div class="info">' +
              '<div class="title">' + esc(r.title) + '</div>' +
              '<div class="artist">' + esc(r.artist) + '</div>' +
              '<div class="meta">' + (r.year || '') + '</div>' +
            '</div>' +
            '<div class="score-pill">' + Number(r.score).toFixed(1) + '</div>' +
          '</div>' +
          (r.comment ? '<div style="margin-top:8px;font-size:13px;color:#cbd5e1;">' + esc(r.comment) + '</div>' : '');
        card.onclick = function() { openModal(r); };
        list.appendChild(card);
      });
    }

    function renderQueue() {
      var list = document.getElementById('queueList');
      document.getElementById('queueCount').textContent = queue.length + ' levyä';
      if (!queue.length) {
        list.innerHTML = '<div class="card" style="text-align:center;color:#94a3b8;">Kuuntelujono on tyhjä.</div>';
        return;
      }
      list.innerHTML = '';
      queue.forEach(function(q) {
        var card = document.createElement('div');
        card.className = 'card album-item';
        card.innerHTML =
          '<img class="cover" src="' + (q.cover || '') + '" alt="" />' +
          '<div class="info"><div class="title">' + esc(q.title) + '</div><div class="artist">' + esc(q.artist) + '</div></div>' +
          '<button type="button" class="btn-primary btn-sm r-btn">Arvioi</button>' +
          '<button type="button" class="btn-secondary btn-sm d-btn">&times;</button>';
        card.querySelector('.r-btn').onclick = function() { openModal(q); };
        card.querySelector('.d-btn').onclick = function() {
          queue = queue.filter(function(x) { return x.id !== q.id; });
          localStorage.setItem('levyraati_queue', JSON.stringify(queue));
          renderQueue();
        };
        list.appendChild(card);
      });
    }

    async function saveAndTest() {
      var id = document.getElementById('clientIdInput').value.trim();
      var sec = document.getElementById('clientSecretInput').value.trim();
      var box = document.getElementById('testResult');

      localStorage.setItem('spotify_client_id', id);
      localStorage.setItem('spotify_client_secret', sec);
      refreshBadge();

      box.className = 'alert alert-ok';
      box.textContent = 'Testataan yhteyttä...';

      try {
        var items = await spotifySearch('Metallica');
        box.className = 'alert alert-ok';
        box.textContent = 'Toimii! Spotify palautti ' + items.length + ' albumia.';
      } catch (err) {
        box.className = 'alert alert-err';
        box.textContent = err.message;
      }
    }

    function clearKeys() {
      ['spotify_client_id', 'spotify_client_secret', 'spotifyClientId', 'spotifyClientSecret'].forEach(function(k) {
        localStorage.removeItem(k);
      });
      document.getElementById('clientIdInput').value = '';
      document.getElementById('clientSecretInput').value = '';
      refreshBadge();
    }

    function exportData() {
      var blob = new Blob([JSON.stringify({ reviews: reviews, queue: queue }, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'levyraati-backup.json';
      a.click();
    }

    function importData(e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function(ev) {
        try {
          var d = JSON.parse(ev.target.result);
          if (Array.isArray(d.reviews)) reviews = d.reviews;
          if (Array.isArray(d.queue)) queue = d.queue;
          localStorage.setItem('levyraati_reviews', JSON.stringify(reviews));
          localStorage.setItem('levyraati_queue', JSON.stringify(queue));
          renderReviews();
          alert('Varmuuskopio palautettu!');
        } catch (err) { alert('Virheellinen tiedosto.'); }
      };
      r.readAsText(f);
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var k = getKeys();
    document.getElementById('clientIdInput').value = k.id;
    document.getElementById('clientSecretInput').value = k.sec;
    refreshBadge();
    renderReviews();
  </script>
</body>
</html>
